<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0820">
  <meta name="robots" content="noindex">
  <title>GAME OVER｜あそぼ.みんな</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    @font-face {
      font-family: "Asobo Dot";
      src: url("/fonts/pixel.woff2") format("woff2");
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      --night: #0b0820;
      --ink: #f4f0ff;
      --muted: #a8a1cb;
      --pink: #ff4fa3;
      --acid: #d8ff4f;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      gap: 20px;
      padding: 32px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px));
      background:
        repeating-linear-gradient(180deg, transparent 0 2px, rgba(0, 0, 0, 0.25) 2px 3px),
        radial-gradient(70% 60% at 50% 40%, #1a1440, var(--night));
      color: var(--ink);
      font: 400 16px/1.7 "Hiragino Sans", "Yu Gothic UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: var(--pink);
      font: 400 clamp(44px, 12vw, 96px)/1 "Asobo Dot", ui-monospace, monospace;
      text-shadow: 0 0 12px rgba(255, 79, 163, 0.7);
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .continue {
      color: var(--acid);
      font: 400 22px/1 "Asobo Dot", ui-monospace, monospace;
      letter-spacing: 0.06em;
    }

    a {
      justify-self: center;
      padding: 10px 22px;
      border: 2px solid var(--acid);
      border-radius: 999px;
      color: var(--acid);
      font-weight: 700;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      background: rgba(216, 255, 79, 0.12);
    }
  </style>
</head>
<body>
  <h1>GAME OVER</h1>
  <p lang="ja">このページは見つかりませんでした。</p>
  <p lang="zh-Hans">找不到这个页面。</p>
  <p class="continue" aria-live="off">CONTINUE? <span id="count">10</span></p>
  <a href="/">あそぼ.みんな にもどる ／ 回到首页</a>
  <script>
    let n = 10;
    const el = document.getElementById("count");
    const timer = setInterval(() => {
      n -= 1;
      el.textContent = String(n);
      if (n <= 0) {
        clearInterval(timer);
        location.href = "/";
      }
    }, 1000);
  </script>
</body>
</html>
