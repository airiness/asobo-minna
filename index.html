<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e8">
  <meta name="description" content="あそぼ。みんな。— 小さなブラウザゲームを集める遊び場。">
  <title>あそぼ。みんな。</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">SMALL WEB GAMES · GGLAB</p>
      <h1>あそぼ。<br><span>みんな。</span></h1>
      <p class="lead">
        ブラウザを開けば、そこが遊び場。<br>
        小さなゲームを少しずつ置いていきます。
      </p>
    </header>

    <section class="games" aria-labelledby="games-title">
      <div class="section-heading">
        <h2 id="games-title">games</h2>
        <span>01</span>
      </div>

      <a class="game-card" href="https://coop.あそぼ.みんな/" aria-label="星核守卫を遊ぶ">
        <div class="game-visual" aria-hidden="true">
          <div class="core"></div>
          <div class="orbit orbit-a"></div>
          <div class="orbit orbit-b"></div>
          <div class="spark spark-a"></div>
          <div class="spark spark-b"></div>
          <div class="spark spark-c"></div>
        </div>

        <div class="game-copy">
          <div class="game-meta">
            <span class="status"><i></i> PLAYABLE</span>
            <span>01</span>
          </div>

          <div>
            <p class="kicker">1–2 PLAYER · CO-OP DEFENSE</p>
            <h3>星核守卫</h3>
            <p class="description">
              星核を守りながら、迫りくる敵を撃ち抜く。
              ふたりで遊べるリアルタイム協力ディフェンス。
            </p>
          </div>

          <div class="card-footer">
            <div class="tags">
              <span>WEBGL</span>
              <span>REALTIME</span>
              <span>CO-OP</span>
            </div>
            <span class="play">あそぶ <b>↗</b></span>
          </div>
        </div>
      </a>

      <div class="coming-soon">
        <span>02</span>
        <p>more games are cooking...</p>
      </div>
    </section>

    <footer>
      <span>あそぼ.みんな</span>
      <a href="https://gglab.dev/">GGLab ↗</a>
    </footer>
  </main>
</body>
</html>
